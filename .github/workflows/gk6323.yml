name: GK6323V100C 潮歌 Z71A 内核构建（histb 补丁 + 分层配置 + 双格式镜像）

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/gk6323.yml'
      - 'kernel.config'
      - 'slim.config'
      - 'dts/**'
      - 'scripts/**'
      - 'apply_histb_patches.sh'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_BRANCH: master
  KERNEL_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  FRAGMENT: kernel.config
  SLIM_FRAGMENT: slim.config
  BOARD_DTS_SRC: dts/gk6323v100c-chaoge-z71a.dts
  UIMAGE_LOAD_ADDR: 0x02000000
  UIMAGE_ENTRY_POINT: 0x02000000
  DTB_FALLBACK_ADDR: 0x03FFC000
  BOOT_IMAGE_MAX_MB: 13
  BOOT_IMAGE_NAME: boot.img
  DTB_IMAGE_NAME: gk6323v100c.dtb
  DTBO_IMAGE_NAME: dtbo.img
  MODULES_ARCHIVE_NAME: modules.tar.gz
  OUTPUT_DIR: output
  HISTB_PATCH_DIR: histb_patches

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          path: config

      - name: 工作流自检
        run: |
          set -euo pipefail
          WF="$GITHUB_WORKSPACE/config/.github/workflows/gk6323.yml"
          if grep -nE '^\s*[^#[:space:]].*\|[^"]*$' "$WF" | grep -v 'bash -e {0}' ; then
            echo "::error::发现带裸露管道的赋值，可能被 GitHub Actions 改写"
            exit 1
          fi
          echo "OK 工作流自检通过"

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio flex git kmod libelf-dev \
            libncurses-dev libssl-dev lz4 python3-dev python3-setuptools \
            swig u-boot-tools wget xz-utils zstd device-tree-compiler
          echo "OK 构建依赖已安装"

      - name: 拉取 histb 补丁库并读取基线
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 https://github.com/96boards-hikey/histb_patches.git "$HISTB_PATCH_DIR"
          KERNEL_VERSION="$(grep '^KERNEL_VERSION=' "$HISTB_PATCH_DIR/baseline" | cut -d= -f2)"
          BASE_SHA="$(grep '^BASE_SHA=' "$HISTB_PATCH_DIR/baseline" | cut -d= -f2)"
          echo "KV=$KERNEL_VERSION" >> "$GITHUB_ENV"
          echo "BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "KERNEL_VERSION=$KERNEL_VERSION"
          echo "BASE_SHA=$BASE_SHA"
          echo "OK 基线读取完成"

      - name: 拉取内核源码（基线 commit 取自补丁库 baseline）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" linux_build
          cd linux_build
          git fetch --depth=1 origin "$BASE_SHA"
          git checkout "$BASE_SHA"
          echo "OK 内核源码已就位（commit=$BASE_SHA）"

      - name: 应用 histb 补丁（调用仓库根目录 apply_histb_patches.sh）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/linux_build"
          chmod +x "$GITHUB_WORKSPACE/config/apply_histb_patches.sh"
          bash "$GITHUB_WORKSPACE/config/apply_histb_patches.sh" -y
          echo "OK histb 补丁应用完成"

      - name: 注入DTB启动兜底补丁
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/linux_build"
          cat > /tmp/dtb_fallback.patch << 'EOF'
          diff --git a/arch/arm64/kernel/head.S b/arch/arm64/kernel/head.S
          index 0000000..1111111 100644
          --- a/arch/arm64/kernel/head.S
          +++ b/arch/arm64/kernel/head.S
          @@ -85,6 +85,16 @@ SYM_CODE_START(primary_entry)
           	bl	preserve_boot_args
           	bl	init_kernel_el			// w0=cpu_boot_mode
           	mov	x20, x0				// 保存 CPU 启动模式
          +	/* 兜底：x0不是有效FDT时，用固定DTB地址 */
          +	ldr	w21, =0xedfe0dd0		// 小端FDT魔数
          +	ldr	w20, [x0]
          +	cmp	w20, w21
          +	b.eq	1f
          +	ldr	x0, =0x03ffc000		// DTB固定加载地址
          +1:
           	mov	x0, x20
           	bl	record_mmu_state
          EOF
          patch -p1 --forward arch/arm64/kernel/head.S < /tmp/dtb_fallback.patch || echo "补丁已存在，跳过"
          echo "OK DTB启动兜底补丁已注入"

      - name: 补全DTS外设硬件节点
        run: |
          set -euo pipefail
          DST_DTS="$GITHUB_WORKSPACE/linux_build/arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dts"
          cp "$GITHUB_WORKSPACE/config/$BOARD_DTS_SRC" "$DST_DTS"
          # 在根节点末尾插入所有硬件节点
          sed -i '/^};/i \
          \  soc {\
          \    compatible = "simple-bus";\
          \    #address-cells = <2>;\
          \    #size-cells = <2>;\
          \    ranges;\
          \\
          \    cru: clock-controller@f8a22000 {\
          \      compatible = "hisilicon,hi3798mv200-cru";\
          \      reg = <0x0 0xf8a22000 0x0 0x1000>;\
          \      #clock-cells = <1>;\
          \      #reset-cells = <2>;\
          \    };\
          \\
          \    usb2_phy: usb-phy@f98c0000 {\
          \      compatible = "hisilicon,inno-usb2-phy";\
          \      reg = <0x0 0xf98c0000 0x0 0x1000>;\
          \      #phy-cells = <0>;\
          \      clocks = <&cru 0x10>;\
          \      resets = <&cru 0x18 0x2>;\
          \    };\
          \\
          \    ethernet@f9c30000 {\
          \      compatible = "hisilicon,femac";\
          \      reg = <0x0 0xf9c30000 0x0 0x1000>;\
          \      interrupts = <0 56 4>;\
          \      clocks = <&cru 0x63>;\
          \      resets = <&cru 0x45 0x0>, <&cru 0x45 0x2>;\
          \      reset-names = "mac", "ephyrst";\
          \      phy-mode = "mii";\
          \      #address-cells = <1>;\
          \      #size-cells = <0>;\
          \      mdio {\
          \        #address-cells = <1>;\
          \        #size-cells = <0>;\
          \        ethphy0: ethernet-phy@0 {\
          \          reg = <0>;\
          \        };\
          \      };\
          \    };\
          \\
          \    ehci@f9890000 {\
          \      compatible = "generic-ehci";\
          \      reg = <0x0 0xf9890000 0x0 0x1000>;\
          \      interrupts = <0 63 4>;\
          \      phys = <&usb2_phy>;\
          \      clocks = <&cru 0x0f>;\
          \      resets = <&cru 0x18 0x0>;\
          \    };\
          \\
          \    ohci@f9880000 {\
          \      compatible = "generic-ohci";\
          \      reg = <0x0 0xf9880000 0x0 0x1000>;\
          \      interrupts = <0 64 4>;\
          \      phys = <&usb2_phy>;\
          \      clocks = <&cru 0x0f>;\
          \      resets = <&cru 0x18 0x1>;\
          \    };\
          \\
          \    i2c@f9ab0000 {\
          \      compatible = "hix5hd2-i2c";\
          \      reg = <0x0 0xf9ab0000 0x0 0x1000>;\
          \      interrupts = <0 36 4>;\
          \      clocks = <&cru 0x57>;\
          \      #address-cells = <1>;\
          \      #size-cells = <0>;\
          \      es8316@10 {\
          \        compatible = "everest,es8316";\
          \        reg = <0x10>;\
          \        clocks = <&cru 0x58>;\
          \      };\
          \    };\
          \\
          \    sdhci@f9830000 {\
          \      compatible = "hisilicon,hi3798mv200-sdhci";\
          \      reg = <0x0 0xf9830000 0x0 0x1000>;\
          \      interrupts = <0 30 4>;\
          \      clocks = <&cru 0x0a>, <&cru 0x4e>;\
          \      clock-names = "ciu", "biu";\
          \      resets = <&cru 0x0b 0x0>;\
          \      bus-width = <8>;\
          \      non-removable;\
          \    };\
          \  };' "$DST_DTS"
          # 预编译DTS校验语法
          dtc -I dts -O dtb -o /dev/null "$DST_DTS"
          echo "OK DTS硬件节点补全完成"

      - name: 合并内核配置（defconfig + 功能片段 + 裁剪片段）
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/linux_build"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/kconfig/merge_config.sh -m -r .config "$GITHUB_WORKSPACE/config/$FRAGMENT" "$GITHUB_WORKSPACE/config/$SLIM_FRAGMENT"
          # 强制开启所有外设必要驱动
          cat >> .config << 'EOF'
          CONFIG_ARCH_HI3798MV200=y
          CONFIG_RESET_CONTROLLER=y
          CONFIG_RESET_HISI=y
          CONFIG_PHY_HISI_INNO_USB2=y
          CONFIG_SND_SOC=y
          CONFIG_SND_SOC_ES8316=y
          CONFIG_HISI_FESTA_PHY=y
          CONFIG_HISI_FEMAC=y
          CONFIG_USB_EHCI_HCD=y
          CONFIG_USB_OHCI_HCD=y
          CONFIG_MMC_HI3798MV200=y
          CONFIG_HIX5HD2_I2C=y
          EOF
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "OK 内核配置合并完成"

      - name: 编译内核、设备树、模块
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/linux_build"
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) \
            Image.gz modules hisilicon/gk6323v100c-chaoge-z71a.dtb
          echo "OK 内核、DTB、模块编译完成"

      - name: 校验内核配置必须项
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/linux_build"
          echo "=== 检查配置必须项 ==="
          REQUIRED_SYMBOLS=(
            "CONFIG_BLK_DEV_DM"
            "CONFIG_DM_CRYPT"
            "CONFIG_CRYPTO_XTS"
            "CONFIG_CRYPTO_AES_ARM64_CE"
            "CONFIG_EXT4_FS"
            "CONFIG_MMC_SDHCI"
            "CONFIG_MMC_HI3798MV200"
            "CONFIG_USB_EHCI_HCD"
            "CONFIG_USB_OHCI_HCD"
            "CONFIG_USB_STORAGE"
            "CONFIG_HISI_FEMAC"
            "CONFIG_HISI_FESTA_PHY"
            "CONFIG_PHY_HISI_INNO_USB2"
            "CONFIG_RESET_HISI"
            "CONFIG_SND_SOC_ES8316"
          )
          for sym in "${REQUIRED_SYMBOLS[@]}"; do
            if ! grep -q "^${sym}=y" .config; then
              echo "::error::缺少必须配置: $sym"
              exit 1
            fi
          done
          echo "OK 配置必须项全部命中"

      - name: 生成uImage、dtbo.img、模块包
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          cd "$GITHUB_WORKSPACE/linux_build"
          # 生成uImage
          mkimage -A arm64 -O linux -T kernel -C gzip -n "Linux-${{ env.KV }}" \
            -a "$UIMAGE_LOAD_ADDR" -e "$UIMAGE_ENTRY_POINT" \
            -d arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/$OUTPUT_DIR/$BOOT_IMAGE_NAME"
          cp arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dtb "$GITHUB_WORKSPACE/$OUTPUT_DIR/$DTB_IMAGE_NAME"
          # 生成2MB对齐dtbo.img
          truncate -s 2097152 "$GITHUB_WORKSPACE/$OUTPUT_DIR/$DTBO_IMAGE_NAME"
          dd if=arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dtb of="$GITHUB_WORKSPACE/$OUTPUT_DIR/$DTBO_IMAGE_NAME" conv=notrunc
          # 打包模块
          mkdir -p /tmp/modules_install
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=/tmp/modules_install modules_install
          cd /tmp/modules_install
          tar czf "$GITHUB_WORKSPACE/$OUTPUT_DIR/$MODULES_ARCHIVE_NAME" lib/modules
          echo "OK 镜像与模块打包完成"

      - name: 镜像与设备树校验
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          echo "=== 校验镜像大小、地址、魔数 ==="
          ls -lh
          BOOT_SIZE_MB=$(( $(stat -c%s "$BOOT_IMAGE_NAME") / 1024 / 1024 ))
          echo "boot.img大小: ${BOOT_SIZE_MB}MB"
          if [ "$BOOT_SIZE_MB" -gt "$BOOT_IMAGE_MAX_MB" ]; then
            echo "::error::boot.img大小超过${BOOT_IMAGE_MAX_MB}MB限制"
            exit 1
          fi
          IH_LOAD=$(dumpimage -l "$BOOT_IMAGE_NAME" | awk '/Load Address:/ {print $NF}')
          IH_ENTRY=$(dumpimage -l "$BOOT_IMAGE_NAME" | awk '/Entry Point:/ {print $NF}')
          IH_ARCH=$(dumpimage -l "$BOOT_IMAGE_NAME" | awk '/Architecture:/ {print $NF}')
          IH_TYPE=$(dumpimage -l "$BOOT_IMAGE_NAME" | awk '/Type:/ {print $2}')
          IH_COMP=$(dumpimage -l "$BOOT_IMAGE_NAME" | awk '/Compression:/ {print $NF}')
          if [ "$IH_LOAD" != "$UIMAGE_LOAD_ADDR" ] || [ "$IH_ENTRY" != "$UIMAGE_ENTRY_POINT" ]; then
            echo "::error::uImage地址不匹配: load=$IH_LOAD entry=$IH_ENTRY"
            exit 1
          fi
          if [ "$IH_ARCH" != "AArch64" ] || [ "$IH_TYPE" != "Kernel" ] || [ "$IH_COMP" != "gzip" ]; then
            echo "::error::uImage类型不正确"
            exit 1
          fi
          # 校验DTB魔数和大小
          DTBO_SIZE=$(stat -c%s "$DTBO_IMAGE_NAME")
          DTB_MAGIC=$(od -An -tx4 -N4 "$DTBO_IMAGE_NAME" | tr -d ' ')
          if [ "$DTBO_SIZE" != "2097152" ]; then
            echo "::error::dtbo.img大小不是2MB"
            exit 1
          fi
          if [ "$DTB_MAGIC" != "d00dfeed" ]; then
            echo "::error::DTB魔数不正确"
            exit 1
          fi
          echo "OK 镜像与DTB校验全部通过"

      - name: 板级dtbo检查
        run: |
          set -euo pipefail
          chmod +x "$GITHUB_WORKSPACE/config/scripts/check-board-dtbo.sh"
          "$GITHUB_WORKSPACE/config/scripts/check-board-dtbo.sh" \
            "$GITHUB_WORKSPACE/$OUTPUT_DIR/$DTBO_IMAGE_NAME" \
            "$GITHUB_WORKSPACE/config/$BOARD_DTS_SRC"
          echo "OK 板级dtbo检查通过"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gk6323v100c-images-${{ github.sha }}
          path: ${{ env.OUTPUT_DIR }}/*.{img,dtb,gz}

      - name: 生成发布说明
        run: |
          set -euo pipefail
          cat > "$GITHUB_WORKSPACE/release_notes.md" << 'EOF'
          # GK6323V100C 潮歌Z71A 内核构建产物
          ## 产物说明
          - `boot.img`：uImage格式内核镜像，加载/入口地址`0x02000000`，直接刷p15分区
          - `dtbo.img`：2MB标准设备树镜像，直接刷p10分区，不需要修改bootcmd
          - `gk6323v100c.dtb`：纯DTB文件，供调试用
          - `modules.tar.gz`：内核模块包，解压到Debian系统`/lib/modules/`目录
          ## TTL刷写命令
          ```bash
          tftp 0x02000000 dtbo.img
          mmc write 0 0x02000000 0x19000 0x4000
          tftp 0x02000000 boot.img
          mmc write 0 0x02000000 0x1d000 0xa000
          reset
          ```
          ## 版本信息
          EOF
          echo "基线版本：${{ env.KV }}" >> "$GITHUB_WORKSPACE/release_notes.md"
          echo "基线commit：${{ env.BASE_SHA }}" >> "$GITHUB_WORKSPACE/release_notes.md"
          echo "Workflow commit：${{ github.sha }}" >> "$GITHUB_WORKSPACE/release_notes.md"
          echo "OK 发布说明生成完成"

      - name: 创建Release并发布产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.KV }}-${{ github.sha }}
          name: GK6323V100C Linux ${{ env.KV }}
          body_path: ${{ github.workspace }}/../release_notes.md
          files: |
            ${{ env.OUTPUT_DIR }}/${{ env.BOOT_IMAGE_NAME }}
            ${{ env.OUTPUT_DIR }}/${{ env.DTB_IMAGE_NAME }}
            ${{ env.OUTPUT_DIR }}/${{ env.DTBO_IMAGE_NAME }}
            ${{ env.OUTPUT_DIR }}/${{ env.MODULES_ARCHIVE_NAME }}