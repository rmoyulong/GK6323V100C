# GK6323V100C (HiSTB SoC) 主线 Linux 自动构建
name: GK6323V100C 主线内核构建

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_BRANCH: master
  KERNEL_REPO: https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git
  FRAGMENT: kernel.config
  SLIM_FRAGMENT: slim.config
  BOARD_DTS_SRC: dts/gk6323v100c-chaoge-z71a.dts
  UIMAGE_LOAD_ADDR: "0x02000000"
  UIMAGE_ENTRY_POINT: "0x02000000"
  DTB_FALLBACK_ADDR: "0x03FFC000"
  BOOT_IMAGE_MAX_MB: 13
  BOOT_IMAGE_NAME: boot.img
  DTB_IMAGE_NAME: gk6323v100c.dtb
  DTBO_IMAGE_NAME: dtbo.img
  MODULES_ARCHIVE_NAME: modules.tar.gz
  OUTPUT_DIR: output

jobs:
  build:
    name: 编译主线内核 + 打包刷机镜像
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4
        with:
          path: gk6323v100c-config

      - name: 拉取 histb 主线补丁仓库
        run: |
          set -euo pipefail
          echo "=== 拉取 histb-mainline_patches ==="
          git clone --depth=1 https://github.com/rmoyulong/histb-mainline_patches.git histb_patches
          echo "HISTB_PATCH_DIR=$(pwd)/histb_patches" >> $GITHUB_ENV

      - name: 读取基线内核版本/提交
        id: baseline
        run: |
          set -euo pipefail
          cd "$HISTB_PATCH_DIR"
          if [ ! -f baseline ]; then
            echo "::error::histb-mainline_patches 根目录缺少 baseline 文件"
            exit 1
          fi
          KERNEL_VERSION=$(grep '^KERNEL_VERSION=' baseline | cut -d= -f2)
          BASE_SHA=$(grep '^BASE_SHA=' baseline | cut -d= -f2)
          if [ -z "$KERNEL_VERSION" ] || [ -z "$BASE_SHA" ]; then
            echo "::error::baseline 缺少 KERNEL_VERSION 或 BASE_SHA"
            exit 1
          fi
          echo "KERNEL_VERSION=$KERNEL_VERSION" >> $GITHUB_ENV
          echo "BASE_SHA=$BASE_SHA" >> $GITHUB_ENV
          echo "kv=$KERNEL_VERSION" >> $GITHUB_OUTPUT
          echo "sha=$BASE_SHA" >> $GITHUB_OUTPUT

      - name: 必要文件预检
        run: |
          set -euo pipefail
          echo "=== 必要文件预检 ==="
          for f in "$GITHUB_WORKSPACE/gk6323v100c-config/$FRAGMENT" \
                   "$GITHUB_WORKSPACE/gk6323v100c-config/$SLIM_FRAGMENT" \
                   "$GITHUB_WORKSPACE/gk6323v100c-config/$BOARD_DTS_SRC" \
                   "$GITHUB_WORKSPACE/gk6323v100c-config/apply_histb_patches.sh" \
                   "$HISTB_PATCH_DIR/baseline"; do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必要文件: $f"
              exit 1
            fi
          done
          echo "OK 所有必要文件已就位"

      - name: 安装构建依赖
        run: |
          set -euo pipefail
          echo "=== 安装构建依赖 ==="
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu \
            u-boot-tools ccache python3-setuptools swig python3-dev python3-pyelftools \
            device-tree-compiler
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-gk6323v100c-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-gk6323v100c-${{ runner.os }}-

      - name: 拉取基线内核源码
        run: |
          set -euo pipefail
          echo "=== 拉取内核 $KERNEL_VERSION (sha $BASE_SHA) ==="
          git clone --depth=50 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" linux_build
          cd linux_build
          git fetch --depth=50 origin "$BASE_SHA"
          git checkout "$BASE_SHA"
          echo "LINUX_BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: 应用 histb 系列主线补丁
        run: |
          set -euo pipefail
          echo "=== 应用 histb 主线补丁 ==="
          cd "$LINUX_BUILD_DIR"
          cp "$HISTB_PATCH_DIR/apply_histb_patches.sh" ./
          chmod +x apply_histb_patches.sh
          ./apply_histb_patches.sh -y "$HISTB_PATCH_DIR"

      - name: 复制板级设备树并加入 Makefile
        run: |
          set -euo pipefail
          echo "=== 注入板级设备树 ==="
          cd "$LINUX_BUILD_DIR"
          DTS_TARGET=arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dts
          cp "$GITHUB_WORKSPACE/gk6323v100c-config/$BOARD_DTS_SRC" "$DTS_TARGET"
          if ! grep -q 'gk6323v100c-chaoge-z71a.dtb' arch/arm64/boot/dts/hisilicon/Makefile; then
            echo 'dtb-$(CONFIG_ARCH_HISI) += gk6323v100c-chaoge-z71a.dtb' >> arch/arm64/boot/dts/hisilicon/Makefile
          fi
          python3 "$GITHUB_WORKSPACE/gk6323v100c-config/dts/check-dts.py" "$DTS_TARGET"
          echo "BOARD_DTS_TARGET=$DTS_TARGET" >> $GITHUB_ENV

      - name: 注入 DTB 兜底启动补丁
        run: |
          set -euo pipefail
          echo "=== 注入 DTB 兜底启动补丁 ==="
          cd "$LINUX_BUILD_DIR"
          HEAD_S=arch/arm64/kernel/head.S
          if [ ! -f "$HEAD_S" ]; then
            echo "::error::未找到 $HEAD_S"
            exit 1
          fi
          if grep -q 'GK6323_DTB_FALLBACK' "$HEAD_S"; then
            echo "补丁已存在，跳过"
            exit 0
          fi
          # 用base64写入汇编补丁，避免YAML语法问题
          echo "" | base64 -d > head_patch.s
          sed -i '/^primary_entry:/r head_patch.s' "$HEAD_S"
          sed -i '0,/^primary_entry:/{/^primary_entry:/d}' "$HEAD_S"
          sed -i 's/^[[:space:]]*bl[[:space:]]*preserve_boot_args/2:\n\tbl\tpreserve_boot_args/' "$HEAD_S"
          rm -f head_patch.s
          grep -q 'GK6323_DTB_FALLBACK' "$HEAD_S"
          echo "OK DTB兜底补丁注入完成"

      - name: 配置内核
        run: |
          set -euo pipefail
          echo "=== 配置内核 ==="
          cd "$LINUX_BUILD_DIR"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/gk6323v100c-config/$FRAGMENT"
          ./scripts/kconfig/merge_config.sh -m .config "$GITHUB_WORKSPACE/gk6323v100c-config/$SLIM_FRAGMENT"
          # 补全必须驱动
          ./scripts/config --set-val CONFIG_ARCH_HI3798MV200 y
          ./scripts/config --set-val CONFIG_RESET_CONTROLLER y
          ./scripts/config --set-val CONFIG_RESET_HISI y
          ./scripts/config --set-val CONFIG_PHY_HISI_INNO_USB2 y
          ./scripts/config --set-val CONFIG_HISI_FEMAC y
          ./scripts/config --set-val CONFIG_MDIO_HISI_FEMAC y
          ./scripts/config --set-val CONFIG_HISI_FESTA_PHY y
          ./scripts/config --set-val CONFIG_USB_EHCI_HCD y
          ./scripts/config --set-val CONFIG_USB_EHCI_PLATFORM y
          ./scripts/config --set-val CONFIG_USB_OHCI_HCD y
          ./scripts/config --set-val CONFIG_USB_OHCI_PLATFORM y
          ./scripts/config --set-val CONFIG_USB_DWC2 y
          ./scripts/config --set-val CONFIG_SND_SOC y
          ./scripts/config --set-val CONFIG_SND_SOC_ES8316 y
          ./scripts/config --set-val CONFIG_CLK_IGNORE_UNUSED y
          make olddefconfig

      - name: 必须配置项校验
        run: |
          set -euo pipefail
          echo "=== 必须项校验 ==="
          cd "$LINUX_BUILD_DIR"
          REQUIRED_ITEMS=(
            "CONFIG_ARCH_HISI=y"
            "CONFIG_ARCH_HI3798MV200=y"
            "CONFIG_ARM_GIC_V3=y"
            "CONFIG_ARM_ARCH_TIMER=y"
            "CONFIG_SERIAL_AMBA_PL011=y"
            "CONFIG_SERIAL_AMBA_PL011_CONSOLE=y"
            "CONFIG_COMMON_CLK_HI3798MV200=y"
            "CONFIG_RESET_CONTROLLER=y"
            "CONFIG_RESET_HISI=y"
            "CONFIG_MMC=y"
            "CONFIG_MMC_DW=y"
            "CONFIG_MMC_DW_HI3798CV200=y"
            "CONFIG_EXT4_FS=y"
            "CONFIG_VFAT_FS=y"
            "CONFIG_NLS_CODEPAGE_437=y"
            "CONFIG_NLS_ISO8859_1=y"
            "CONFIG_USB=y"
            "CONFIG_USB_EHCI_HCD=y"
            "CONFIG_USB_EHCI_PLATFORM=y"
            "CONFIG_USB_OHCI_HCD=y"
            "CONFIG_USB_OHCI_PLATFORM=y"
            "CONFIG_USB_DWC2=y"
            "CONFIG_USB_STORAGE=y"
            "CONFIG_PHY_HISI_INNO_USB2=y"
            "CONFIG_HISI_FEMAC=y"
            "CONFIG_MDIO_HISI_FEMAC=y"
            "CONFIG_HISI_FESTA_PHY=y"
            "CONFIG_SND=y"
            "CONFIG_SND_SOC=y"
            "CONFIG_SND_SOC_ES8316=y"
            "CONFIG_SND_USB_AUDIO=y"
            "CONFIG_CLK_IGNORE_UNUSED=y"
            "CONFIG_SQUASHFS=y"
            "CONFIG_SQUASHFS_XZ=y"
            "CONFIG_OVERLAY_FS=y"
            "CONFIG_PACKET=y"
            "CONFIG_UNIX=y"
            "CONFIG_INET=y"
          )
          for item in "${REQUIRED_ITEMS[@]}"; do
            if ! grep -q "^${item}$" .config; then
              echo "::error::必须项 $item 未开启"
              exit 1
            fi
          done
          echo "OK 所有必须项已开启"

      - name: 编译内核
        run: |
          set -euo pipefail
          echo "=== 开始编译内核 ==="
          cd "$LINUX_BUILD_DIR"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make -j$(nproc) Image.gz dtbs
          echo "=== 编译模块 ==="
          make -j$(nproc) modules

      - name: 生成 uImage 刷机镜像
        run: |
          set -euo pipefail
          echo "=== 生成 uImage ==="
          cd "$LINUX_BUILD_DIR"
          if [ ! -f arch/arm64/boot/Image.gz ]; then
            echo "::error::未找到 arch/arm64/boot/Image.gz"
            exit 1
          fi
          mkimage -A arm64 \
                  -O linux \
                  -T kernel \
                  -C gzip \
                  -a "$UIMAGE_LOAD_ADDR" \
                  -e "$UIMAGE_ENTRY_POINT" \
                  -n "Linux-${KERNEL_VERSION}-gk6323v100c" \
                  -d arch/arm64/boot/Image.gz \
                  "$BOOT_IMAGE_NAME"
          if [ ! -f "$BOOT_IMAGE_NAME" ]; then
            echo "::error::生成 $BOOT_IMAGE_NAME 失败"
            exit 1
          fi
          MAGIC=$(od -An -tx4 -N4 "$BOOT_IMAGE_NAME" | tr -d ' ')
          if [ "$MAGIC" != "27051956" ]; then
            echo "::error::uImage 魔数校验失败"
            exit 1
          fi
          BOOT_SIZE_MB=$(du -m "$BOOT_IMAGE_NAME" | cut -f1)
          if [ "$BOOT_SIZE_MB" -gt "$BOOT_IMAGE_MAX_MB" ]; then
            echo "::error::$BOOT_IMAGE_NAME 大小 ${BOOT_SIZE_MB}MB 超过限制"
            exit 1
          fi
          echo "OK uImage 校验通过"

      - name: 校验板级 DTB 魔数
        run: |
          set -euo pipefail
          echo "=== 校验板级 DTB ==="
          cd "$LINUX_BUILD_DIR"
          DTB_PATH=arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dtb
          if [ ! -f "$DTB_PATH" ]; then
            echo "::error::未找到板级 DTB"
            exit 1
          fi
          MAGIC=$(od -An -tx4 -N4 "$DTB_PATH" | tr -d ' ')
          if [ "$MAGIC" != "d00dfeed" ]; then
            echo "::error::DTB 魔数校验失败"
            exit 1
          fi
          echo "OK DTB 校验通过"

      - name: 生成2MiB dtbo.img
        run: |
          set -euo pipefail
          echo "=== 生成2MiB dtbo.img ==="
          cd "$LINUX_BUILD_DIR"
          DTB_PATH=arch/arm64/boot/dts/hisilicon/gk6323v100c-chaoge-z71a.dtb
          truncate -s 2097152 "$DTBO_IMAGE_NAME"
          dd if="$DTB_PATH" of="$DTBO_IMAGE_NAME" conv=notrunc status=none
          DTBO_SIZE=$(stat -c%s "$DTBO_IMAGE_NAME")
          if [ "$DTBO_SIZE" -ne 2097152 ]; then
            echo "::error::dtbo.img大小错误"
            exit 1
          fi
          echo "OK dtbo.img生成完成"

      - name: 打包内核模块
        run: |
          set -euo pipefail
          echo "=== 打包内核模块 ==="
          cd "$LINUX_BUILD_DIR"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          INSTALL_MOD_PATH=$(pwd)/modules_install
          rm -rf "$INSTALL_MOD_PATH"
          mkdir -p "$INSTALL_MOD_PATH"
          make modules_install INSTALL_MOD_PATH="$INSTALL_MOD_PATH"
          cd "$INSTALL_MOD_PATH"
          tar czf "$LINUX_BUILD_DIR/$MODULES_ARCHIVE_NAME" lib/modules
          echo "OK 模块打包完成"

      - name: 收集产物
        run: |
          set -euo pipefail
          echo "=== 收集产物 ==="
          mkdir -p "$OUTPUT_DIR"
          cd "$LINUX_BUILD_DIR"
          cp "$BOOT_IMAGE_NAME" "$GITHUB_WORKSPACE/$OUTPUT_DIR/"
          cp "$DTBO_IMAGE_NAME" "$GITHUB_WORKSPACE/$OUTPUT_DIR/"
          cp "$MODULES_ARCHIVE_NAME" "$GITHUB_WORKSPACE/$OUTPUT_DIR/"
          cd "$GITHUB_WORKSPACE/$OUTPUT_DIR"
          sha256sum * > sha256sums.txt
          ls -lh
          echo "OUTPUT_DIR_ABS=$GITHUB_WORKSPACE/$OUTPUT_DIR" >> $GITHUB_ENV

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gk6323v100c-kernel-${{ steps.baseline.outputs.kv }}
          path: ${{ env.OUTPUT_DIR_ABS }}

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.baseline.outputs.kv }}
          name: GK6323V100C 主线内核 ${{ steps.baseline.outputs.kv }}
          files: |
            ${{ env.OUTPUT_DIR_ABS }}/${{ env.BOOT_IMAGE_NAME }}
            ${{ env.OUTPUT_DIR_ABS }}/${{ env.DTBO_IMAGE_NAME }}
            ${{ env.OUTPUT_DIR_ABS }}/${{ env.MODULES_ARCHIVE_NAME }}
            ${{ env.OUTPUT_DIR_ABS }}/sha256sums.txt
