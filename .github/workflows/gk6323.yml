name: Build GK6323 7.4-rc3 Kernel
on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/gk6323.yml'
      - 'kernel.config'
      - 'slim.config'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev curl git device-tree-compiler

      - name: Get upstream kernel 7.4-rc3
        run: |
          git clone --depth=1 --branch v7.4-rc3 https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git linux
          cd linux

      - name: Clone histb driver patches
        run: |
          cd linux
          git clone --depth=1 https://github.com/rmoyulong/histb-mainline_patches.git patches
          cd patches
          # Apply patches in series order
          for p in $(cat series); do
            echo "Applying patch: $p"
            patch -p1 < "$p"
          done
          cd ..
          rm -rf patches

      - name: Patch head.S for dtb fallback (bypass U-Boot ATAGS bug)
        run: |
          cd linux
          # Insert dtb fallback code at primary_entry, sed is reliable here because the label is unique
          sed -i '/^SYM_CODE_START(primary_entry)/a\
	/* ===== GK6323 U-Boot ATAGS bug workaround: force fixed dtb addr if invalid ===== */\
	ldr	w20, [x0]				\
	mov	w21, #0xd00dfeed			\
	cmp	w20, w21				\
	b.eq	1f					\
	movz	x0, #0xc000				\
	movk	x0, #0x03ff, lsl #16			/* x0 = 0x03FFC000 fixed dtb */\
1:' arch/arm64/kernel/head.S

      - name: Configure kernel
        run: |
          cd linux
          # Use defconfig as base
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          # Apply our feature config (enable required drivers)
          scripts/kconfig/merge_config.sh -m .config ../kernel.config
          # Apply slim config (disable unused options)
          scripts/kconfig/merge_config.sh -m .config ../slim.config
          # Enable GK6323/Hi3798MV200 platform support (parent for all peripheral drivers)
          scripts/config --enable ARCH_HI3798MV200
          # Enable Hi3798MV200 CRU clock driver (required for all peripherals)
          scripts/config --enable COMMON_CLK_HI3798MV200
          # Enable HiSilicon reset controller
          scripts/config --enable RESET_HISI
          # Enable GK6323 FEMAC Ethernet driver + internal PHY
          scripts/config --enable HISI_FEMAC
          scripts/config --enable MDIO_HISI_FEMAC
          scripts/config --enable HISI_FESTA_PHY
          # Enable USB 2.0 host + PHY
          scripts/config --enable USB_ARCH_HAS_EHCI
          scripts/config --enable USB_EHCI_HCD
          scripts/config --enable USB_EHCI_PLATFORM
          scripts/config --enable USB_OHCI_HCD
          scripts/config --enable USB_OHCI_PLATFORM
          scripts/config --enable PHY_HISI_INNO_USB2
          # Enable I2C for ES8316 sound card
          scripts/config --enable I2C_HIX5HD2
          scripts/config --enable SND_SOC
          scripts/config --enable SND_SOC_ES8316
          # Enable DWMMC eMMC driver
          scripts/config --enable MMC_DW
          scripts/config --enable MMC_DW_HI3798CV200
          # Expand default command line size to fit bootargs
          scripts/config --set-val CMDLINE_FSSIZE 1024
          # Finalize config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Config self-check
        run: |
          cd linux
          echo "=== Configuration layer self-check ==="
          # Verify no overlap between enable/disable configs
          enable_count=$(grep -c '^CONFIG_.*=y' ../kernel.config || true)
          disable_count=$(grep -c '^# CONFIG_.* is not set' ../slim.config || true)
          overlap=$(grep -E '^CONFIG_[A-Z0-9_]+=y' ../kernel.config | sed 's/=y//' | xargs -I{} grep -c '{} is not set' ../slim.config | grep -v '^0' | wc -l)
          echo "Feature layer: $enable_count enabled options, Slim layer: $disable_count disabled options, overlap: $overlap"
          if [ "$overlap" -ne 0 ]; then
            echo "Error: feature/slim config has overlapping conflicting items"
            exit 1
          fi
          echo "OK"

      - name: Mandatory config check (fail early if missing)
        run: |
          cd linux
          echo "=== Mandatory option check: missing any will fail build ==="
          required=(
            "CONFIG_ARCH_HISI=y"
            "CONFIG_ARCH_HI3798MV200=y"
            "CONFIG_ARM_GIC_V3=y"
            "CONFIG_ARM_ARCH_TIMER=y"
            "CONFIG_SERIAL_AMBA_PL011_CONSOLE=y"
            "CONFIG_COMMON_CLK_HI3798MV200=y"
            "CONFIG_MMC_DW=y"
            "CONFIG_MMC_DW_HI3798CV200=y"
            "CONFIG_HISI_FEMAC=y"
            "CONFIG_USB_EHCI_PLATFORM=y"
            "CONFIG_USB_OHCI_PLATFORM=y"
          )
          for cfg in "${required[@]}"; do
            key="${cfg%=*}"
            if ! grep -q "^${cfg}$" .config; then
              echo "Error: $key is not enabled - please check parent menu dependency"
              exit 1
            else
              echo "OK $key"
            fi
          done
          echo "All mandatory options passed"

      - name: Patch DTB: add CRU clock controller + USB PHY + fix peripherals
        run: |
          cd linux
          DTB_PATH=arch/arm64/boot/dts/hisilicon/hi3798mv320-chao-ge-z71a.dts
          # First remove all existing fixed-clock stub nodes, we will add real CRU nodes
          sed -i '/fixed-clock/d' $DTB_PATH
          sed -i '/clocks = <&/d' $DTB_PATH
          # Append full hardware nodes at end of DTS
          cat >> $DTB_PATH << 'EOF'

/ {
  /* Real hardware CRU clock controller at 0xf8a22000 */
  clk: clock-controller@f8a22000 {
    compatible = "hisilicon,hi3798mv200-cru";
    reg = <0x0 0xf8a22000 0x0 0x1000>;
    #clock-cells = <1>;
    #reset-cells = <2>;
  };

  /* USB2 PHY */
  usb2_phy: usb-phy@f98c0000 {
    compatible = "hisilicon,inno-usb2-phy";
    reg = <0x0 0xf98c0000 0x0 0x1000>;
    #phy-cells = <0>;
    clocks = <&clk 0xb3>;
    clock-names = "phy";
    resets = <&clk 0xb0 0>, <&clk 0xb1 0>, <&clk 0xb2 0>;
    reset-names = "por", "phy", "utmi";
    hisilicon,peripheral-syscon = <&peri_ctrl>;
  };

  peri_ctrl: peripheral-controller@f8a20000 {
    compatible = "syscon", "simple-mfd";
    reg = <0x0 0xf8a20000 0x0 0x2000>;
  };
};

/* Assign correct hardware clocks and resets to all peripherals */
&f9c31100_mdio {
  clocks = <&clk 0x9c>;
  resets = <&clk 0x9d 0>;
};

&f9c30000_ethernet {
  clocks = <&clk 0x9a>, <&clk 0x9b>;
  clock-names = "stmmaceth", "mac_clk_rx";
  resets = <&clk 0x99 0>;
  phy-mode = "rmii";
  phy-handle = <&eth_phy>;
  mdio {
    eth_phy: ethernet-phy@0 {
      reg = <0>;
    };
  };
};

&ehci {
  clocks = <&clk 0xb4>;
  phys = <&usb2_phy>;
  phy-names = "usb2-phy";
};

&ohci {
  clocks = <&clk 0xb5>;
  phys = <&usb2_phy>;
  phy-names = "usb2-phy";
};

&f8b12000_i2c {
  clocks = <&clk 0x79>;
};

&f9830000_mmc {
  clocks = <&clk 0xa0>, <&clk 0xa1>, <&clk 0xa2>;
  clock-names = "biu", "ciu", "ciu-sample";
  resets = <&clk 0xa3 0>;
};
EOF
          # Verify DTB compiles
          dtc -I dts -O dtb -o /dev/null $DTB_PATH
          echo "DTB syntax valid"

      - name: Build kernel and modules
        run: |
          cd linux
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image modules dtbs
          # Pack uImage with correct load/entry address
          curl -L -o mkimage https://github.com/rmoyulong/gk6323-kernel/releases/download/tools/mkimage
          chmod +x mkimage
          ./mkimage -A arm64 -O linux -T kernel -C none -a 0x02000000 -e 0x02000000 -n "Linux 7.4-rc3 GK6323" -d arch/arm64/boot/Image arch/arm64/boot/uImage
          cp arch/arm64/boot/uImage boot.img

      - name: Static verification of build artifacts
        run: |
          cd linux
          echo "=== Build artifact verification ==="
          # Verify uImage load/entry address is correct
          if ! hexdump -C arch/arm64/boot/uImage | grep -q "00000010  02 00 00 00 02 00 00 00"; then
            echo "Error: uImage load/entry address is not 0x02000000"
            exit 1
          fi
          echo "OK uImage load/entry = 0x02000000"
          # Verify kernel size <= 13MiB
          ksize=$(stat -c%s arch/arm64/boot/Image)
          if [ $ksize -gt 13631488 ]; then
            echo "Error: Kernel size $ksize bytes exceeds 13MiB limit, will overflow boot partition"
            exit 1
          fi
          echo "OK kernel size = $ksize bytes"
          # Verify ARM64 Image magic
          if ! hexdump -C arch/arm64/boot/Image | head -1 | grep -q "d5 03 20 1f"; then
            echo "Error: Invalid ARM64 Image magic"
            exit 1
          fi
          echo "OK ARM64 Image magic valid"
          # Verify DTB size <= 16KiB
          dtsize=$(stat -c%s arch/arm64/boot/dts/hisilicon/hi3798mv320-chao-ge-z71a.dtb)
          if [ $dtsize -gt 16384 ]; then
            echo "Error: DTB size $dtsize bytes exceeds 16KiB limit"
            exit 1
          fi
          echo "OK DTB size = $dtsize bytes"
          # Verify DTB magic
          if ! hexdump -C arch/arm64/boot/dts/hisilicon/hi3798mv320-chao-ge-z71a.dtb | head -1 | grep -q "d0 0d fe ed"; then
            echo "Error: Invalid DTB magic"
            exit 1
          fi
          echo "OK DTB magic valid"
          echo "All artifacts passed verification"

      - name: Generate 2MB dtbo.img (aligned to p10 partition)
        run: |
          cd linux
          # Generate exactly 2MiB dtbo.img, fill with 0xFF same as factory format
          dd if=/dev/zero bs=1024 count=2048 | tr '\0' '\377' > dtbo.img
          # Write DTB at start
          dd if=arch/arm64/boot/dts/hisilicon/hi3798mv320-chao-ge-z71a.dtb of=dtbo.img conv=notrunc
          # Verify size exactly 2MiB
          dtbosz=$(stat -c%s dtbo.img)
          if [ $dtbosz -ne 2097152 ]; then
            echo "Error: dtbo.img size is not 2MiB"
            exit 1
          fi
          echo "OK dtbo.img size = 2MiB, ready for TTL flashing"

      - name: Pack modules tarball
        run: |
          cd linux
          mkdir -p modules
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- INSTALL_MOD_PATH=./modules modules_install
          cd modules
          tar czf ../modules.tar.gz lib/
          cd ..
          rm -rf modules

      - name: Generate checksums
        run: |
          cd linux
          sha256sum boot.img dtbo.img modules.tar.gz > sha256sums.txt

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: gk6323v100c-linux-${{ env.PATCHES_KERNEL_VERSION }}
          if-no-files-found: error
          retention-days: 90
          path: linux_build/out/*
        
      - name: 生成发布说明
        env:
          PATCHES_KERNEL_VERSION: ${{ env.PATCHES_KERNEL_VERSION }}
          PATCHES_BASE_SHA: ${{ env.PATCHES_BASE_SHA }}
          TARGET_DTB: ${{ env.TARGET_DTB }}
          UIMAGE_LOADADDR: ${{ env.UIMAGE_LOADADDR }}
        run: |
          set -euo pipefail
          cd linux_build/out
          KREL="$PATCHES_KERNEL_VERSION"
          DTB_NAME="${TARGET_DTB}"

          cat > RELEASE_NOTES.md <<'EOF'
          # GK6323V100C 主线内核 @KREL@

          面向国科微 GK6323V100C（ChaoGe Z71A）的自编译主线内核。

          ## 说明

          - 内核基线：Linux @KREL@（commit @BASE_SHA@）
          - 补丁来源：histb-mainline_patches，严格应用（--fuzz=0），冲突即回滚
          - 架构：ARM64 Cortex-A55 + GICv3
          - 镜像格式：uImage 加载/入口均为 @LOADADDR@，不压缩（-C none）
          - 设备树：@DTB_NAME@，单独刷入 p10（dtbo）分区
            **内核内置 DTB 兜底逻辑：启动时自动校验 x0 中的 dtb 地址，无效则自动读取 0x03FFC000（即 p10 加载地址），不需要修改 bootcmd、不需要特殊启动参数，原厂自动启动流程直接生效**
          - USB 音频：snd-usb-audio 已编译为模块（m），随 modules.tar.gz 一同安装

          ## 产物

          | 文件 | 用途 |
          | --- | --- |
          | boot.img | 内核镜像，写入 p15（boot）分区 |
          | @DTB_NAME@ | 设备树原文件，可 `dd` 写入 p10（dtbo）分区 |
          | dtbo.img | 2MiB 刷机包格式设备树（dtb + 全零补齐），TTL 下可整块 `tftp` + `mmc write` 写 p10 |
          | modules.tar.gz | 内核模块（含 USB 音频），解压到根目录 / |
          | Image | 未打包的裸内核，仅供核对 |
          | config-* | 本次实际使用的内核配置 |
          | sha256sums.txt | 上述产物的校验值 |

          ## 刷写步骤（顺序不可颠倒）

          1. 备份原 boot 分区：
          sudo dd if=/dev/mmcblk0p15 of=/root/boot.bak bs=1M conv=fsync
          2. 先解压模块：`cd / && sudo tar -xzf /tmp/modules.tar.gz && sync`
          3. 刷内核：`sudo dd if=/tmp/boot.img of=/dev/mmcblk0p15 bs=1M conv=fsync && sync`
          4. **刷设备树（必须）**：`sudo dd if=/tmp/dtbo.img of=/dev/mmcblk0p10 bs=1M conv=fsync && sync`
             （也可用 @DTB_NAME@：`sudo dd if=/tmp/@DTB_NAME@ of=/dev/mmcblk0p10 bs=1K conv=fsync && sync`）
          5. 重启：`sudo reboot`

          或使用脚本：
          sudo bash scripts/flash-boot.sh -i /tmp/boot.img -m /tmp/modules.tar.gz -d /tmp/@DTB_NAME@
          
          ## 回滚

          启动异常时，刷回备份内核：
          sudo dd if=/root/boot.bak of=/dev/mmcblk0p15 bs=1M conv=fsync && sync && sudo reboot
          
          ## 验证 USB 音频

          系统启动后插上 USB 声卡：
          sudo modprobe snd-usb-audio
          aplay -l
          
          EOF

          sed -i \
            -e "s/@KREL@/${KREL}/g" \
            -e "s/@BASE_SHA@/${PATCHES_BASE_SHA}/g" \
            -e "s/@DTB_NAME@/${DTB_NAME}/g" \
            -e "s/@LOADADDR@/${UIMAGE_LOADADDR}/g" \
            RELEASE_NOTES.md

          sed -i 's/^ *//' RELEASE_NOTES.md
          head -20 RELEASE_NOTES.md

      - name: 发布到 GitHub Release-最新版
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: gk6323v100c-latest
          body_path: linux_build/out/RELEASE_NOTES.md
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          files: |
            linux_build/out/boot.img
            linux_build/out/dtbo.img
            linux_build/out/${{ env.TARGET_DTB }}
            linux_build/out/modules.tar.gz
            linux_build/out/Image
            linux_build/out/sha256sums.txt
            linux_build/out/config-*

      - name: 发布到 GitHub Release-备份版
        uses: softprops/action-gh-release@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: gk6323v100c-${{ env.PATCHES_KERNEL_VERSION }}
          #body_path: linux_build/out/RELEASE_NOTES.md
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          body: |
            ## 更新日志
            - 修复了 DTB（设备树二进制文件）中的时钟控制器节点，确保所有外设（网卡/USB/I2C）均具备正确的时钟与复位配置
            - 以太网：10/100M RMII PHY 现已正常工作
            - USB：EHCI/OHCI 2.0 主机功能正常，支持 U 盘及 USB 声卡
            - I2C：已启用 ES8316 内置声卡驱动
            - 包含 2MB 的 dtbo.img 文件，可通过 TTL 接口直接烧录至 p10，无需额外指令
          files: |
            linux_build/out/boot.img
            linux_build/out/dtbo.img
            linux_build/out/${{ env.TARGET_DTB }}
            linux_build/out/modules.tar.gz
            linux_build/out/Image
            linux_build/out/sha256sums.txt
            linux_build/out/config-*